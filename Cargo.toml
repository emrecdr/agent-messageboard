[package]
name = "amb"
version = "0.2.0"
edition = "2024"
license = "MIT"
# Matches the pin in rust-toolchain.toml, which local builds use — so this is the version the
# project is actually built and tested with, not an aspirational floor.
rust-version = "1.98.0"
# Private tool — guard against accidental `cargo publish` to crates.io.
publish = false
description = "Message bus for concurrent coding-agent sessions on one machine"
# Required by `dist` to generate the release workflow, and by nothing else. Adding it does not
# reopen D56: `publish = false` above still stands, and `dist` is told to look past it below.
repository = "https://github.com/emrecdr/agent-messageboard"

# **`publish = false` hides the binary from `dist`, and this is the flag that unhides it** (D116).
# Without it `dist` reports "this workspace doesn't have anything to Release" — a stranger reading
# that would reasonably conclude the fix is to flip `publish`, which is the one thing D56 refuses.
# Distribution and publication are separate axes; this line is what keeps them separate.
[package.metadata.dist]
dist = true

[[bin]]
name = "amb"
path = "src/main.rs"

# Lint policy lives here rather than only on a CI command line, so rust-analyzer — the surface
# these are actually read on, while typing — sees the same policy the build does.
[lints.clippy]
# A stub that compiles is worse than one that doesn't. This binary is invoked by other agents
# from hooks: an unreached `todo!()` on the delivery path means mail silently isn't delivered,
# which looks identical to an empty inbox.
todo = "deny"
unimplemented = "deny"
# Hooks capture stdout and feed it to a model. A stray `dbg!` becomes model context.
dbg_macro = "deny"
# `unwrap` in a hook-invoked binary panics inside someone else's session. D9 requires that mail
# delivery never break a session, and that starts with not panicking.
unwrap_used = "deny"

[dependencies]
# `anyhow` was here and no line of code ever imported it (M68). `tools/check_unused_deps.py`
# is in the gate so the next one is caught by arithmetic rather than by an audit.
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.189"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.27.0"

# Set explicitly rather than inherited, because the binary is invoked once per hook per tool
# call and the published startup figures are measured against it (audit round two). `thin` LTO
# and one codegen unit are the standard cheap wins for a small binary; `strip` matters because
# this binary is copied to two places (`~/.cargo/bin`, `~/.local/bin`) on every install.
# README's startup numbers were re-measured against this profile the day it landed — a profile
# change is a measurement change (M-rule: repeat any measurement before quoting it).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# What `dist` builds release artifacts with. Written by `dist init`; kept because the released
# binary should be the one the startup figures describe. It inherits `release` above, so the
# three settings there apply and only `lto` is restated.
[profile.dist]
inherits = "release"
lto = "thin"
