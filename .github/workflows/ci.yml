# **This workflow ran for the first time on 2026-08-31, and both platforms passed.**
#
# It said "THIS WORKFLOW HAS NEVER RUN" from the day it was written until that push, which was
# true and load-bearing: `git remote -v` was empty, GitHub Actions executes on a remote, and a
# workflow file that looks like coverage while providing none is the shape D45, D51 and D58
# record. The remote was added when the repository was published; the claim inverted the same
# minute, and this header is corrected rather than deleted because a file that quietly acquires
# a true statement teaches nobody (D27's convention).
#
# Run 33388877601, 1m6s, `ubuntu-latest` and `macos-latest` both green.
#
# **What that first run actually bought, and it is not redundancy: Linux.** Every check in this
# project had only ever executed on macOS. Liveness is `libc::kill`, `db::guard_location`
# compiles a different branch per OS, and `HOME` is read in three places — all of it unbuilt and
# unlinted on Linux until this ran. That is the reason for the matrix, and it is now evidence
# rather than an intention.
#
# **`tools/verify.sh` remains the gate**, via `git config core.hooksPath .githooks`. It fires
# before a commit exists; this fires after one is pushed, so the local gate is still the one that
# stops a bad commit being written. This file duplicates its checks so the two cannot disagree
# about what "verified" means — which is why `check_secret_literals.py` is in the list below: it
# was added to the gate after this workflow was written, and the two had silently diverged.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both, deliberately. The lint and test surface is genuinely platform-dependent here:
        # liveness is `libc::kill`, and `db::guard_location` compiles a different branch per OS.
        # A single-platform matrix would leave the `cfg`-gated half unbuilt and unlinted.
        os: [ubuntu-latest, macos-latest]
    steps:
      # Actions are pinned to a full commit SHA, not a moving tag — the tj-actions/changed-files
      # compromise (March 2025) moved a tag to malicious code, and a tag pin would have followed
      # it. The `# vN` comment is the human-readable version; `.github/dependabot.yml`'s
      # `github-actions` updater bumps both the digest and the comment, so this does not rot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `tools/check_docs.py` compares `[Unreleased]` against commits since the last tag, so
          # it needs history and tags, not the default shallow clone.
          fetch-depth: 0

      # No `toolchain:` input on purpose — with none given, this action installs exactly what
      # `rust-toolchain.toml` pins (1.98.0) and the components it lists (rustfmt, clippy). The pin
      # is load-bearing: that file is the only reason `cargo` resolves in this directory at all on
      # the development machine, which has no rustup default. Naming a version here would let CI
      # and local builds drift, which is the thing the pin exists to prevent.
      # Caching (Swatinem/rust-cache) is on by default.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      # `--locked` mirrors the gate (D70): a resolve that disagrees with Cargo.lock fails
      # rather than silently updating it — the lockfile is the exposure bound against a
      # compromised dependency release, and it only works if nothing moves it as a side effect.
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked

      # **Advisories, Linux only.** `cargo-audit` over `Cargo.lock` against the RustSec database.
      #
      # Chosen over `cargo-deny`, and the reason is this project's own ethos rather than a view on
      # which tool is better. `cargo-deny` adds licence policy, source restrictions and duplicate
      # bans, and needs a `deny.toml` to express them — a config file that has to be kept true, in
      # a repository whose recorded failure mode is an artefact quietly drifting from what it
      # claims. Six direct dependencies and `publish = false` means licence policy answers a
      # question nobody is asking here, while advisories answer one that matters: D100 already
      # argues the vendored SQLite is a contract surface worth watching, and RustSec is the only
      # thing that would say so first.
      #
      # `cargo-deny` is the escalation if this is ever published to crates.io.
      - name: dependency advisories
        if: matrix.os == 'ubuntu-latest'
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Linux only: these are platform-independent, and running them twice would report every
      # drift twice.
      - name: documentation audit
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 tools/check_docs.py
          python3 tools/find_unread_fields.py
          python3 tools/check_mutation_coverage.py
          python3 tools/check_secret_literals.py
